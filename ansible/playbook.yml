---
- name: Configure Practical Task EC2
  hosts: localhost
  connection: local
  become: true

  vars:
    practical_task_branch: "terraform-automation"
    project_dir: "/opt/practical-task"

    jenkins_home: "/var/lib/jenkins"
    jenkins_casc_dir: "/var/lib/jenkins/casc"

    plugin_manager_version: "2.15.0"
    plugin_manager_jar: "/opt/jenkins-plugin-manager.jar"

  tasks:
    # ==================================================
    # SYSTEM
    # ==================================================

    - name: Update Amazon Linux packages
      ansible.builtin.dnf:
        name: "*"
        state: latest
        update_cache: true

    - name: Install required packages
      ansible.builtin.dnf:
        name:
          - git
          - unzip
          - wget
          - fontconfig
          - java-21-amazon-corretto
          - docker
        state: present

    # ==================================================
    # DOCKER
    # ==================================================

    - name: Enable and start Docker
      ansible.builtin.systemd_service:
        name: docker
        enabled: true
        state: started

    # ==================================================
    # JENKINS REPOSITORY
    # ==================================================

    - name: Add Jenkins repository
      ansible.builtin.get_url:
        url: https://pkg.jenkins.io/rpm-stable/jenkins.repo
        dest: /etc/yum.repos.d/jenkins.repo
        mode: "0644"

    - name: Import Jenkins repository key
      ansible.builtin.rpm_key:
        state: present
        key: https://pkg.jenkins.io/redhat-stable/jenkins.io-2026.key

    # ==================================================
    # JENKINS
    # ==================================================

    - name: Install Jenkins
      ansible.builtin.dnf:
        name: jenkins
        state: present

    - name: Add Jenkins user to Docker group
      ansible.builtin.user:
        name: jenkins
        groups: docker
        append: true

    - name: Stop Jenkins before configuration
      ansible.builtin.systemd_service:
        name: jenkins
        state: stopped
      failed_when: false

    # ==================================================
    # JENKINS PLUGINS
    # ==================================================

    - name: Create Jenkins plugins directory
      ansible.builtin.file:
        path: "{{ jenkins_home }}/plugins"
        state: directory
        owner: jenkins
        group: jenkins
        mode: "0755"

    - name: Download Jenkins Plugin Installation Manager
      ansible.builtin.get_url:
        url: "https://github.com/jenkinsci/plugin-installation-manager-tool/releases/download/{{ plugin_manager_version }}/jenkins-plugin-manager-{{ plugin_manager_version }}.jar"
        dest: "{{ plugin_manager_jar }}"
        mode: "0644"

    - name: Install Jenkins plugins
      ansible.builtin.command:
        cmd: >
          java -jar {{ plugin_manager_jar }}
          --war /usr/share/java/jenkins.war
          --plugin-download-directory {{ jenkins_home }}/plugins
          --plugins
          configuration-as-code
          job-dsl
          workflow-aggregator
          git
      changed_when: true

    - name: Set Jenkins plugins ownership
      ansible.builtin.file:
        path: "{{ jenkins_home }}/plugins"
        owner: jenkins
        group: jenkins
        recurse: true

    # ==================================================
    # JENKINS CONFIGURATION AS CODE
    # ==================================================

    - name: Create Jenkins JCasC directory
      ansible.builtin.file:
        path: "{{ jenkins_casc_dir }}"
        state: directory
        owner: jenkins
        group: jenkins
        mode: "0755"

    - name: Copy Jenkins JCasC configuration
      ansible.builtin.copy:
        src: /opt/bootstrap-repo/jenkins/jenkins.yaml
        dest: "{{ jenkins_casc_dir }}/jenkins.yaml"
        remote_src: true
        owner: jenkins
        group: jenkins
        mode: "0644"

    - name: Copy Jenkins Job DSL
      ansible.builtin.copy:
        src: /opt/bootstrap-repo/jenkins/jobs.groovy
        dest: "{{ jenkins_casc_dir }}/jobs.groovy"
        remote_src: true
        owner: jenkins
        group: jenkins
        mode: "0644"

    # ==================================================
    # JENKINS SYSTEMD
    # ==================================================

    - name: Create Jenkins systemd override directory
      ansible.builtin.file:
        path: /etc/systemd/system/jenkins.service.d
        state: directory
        mode: "0755"

    - name: Configure Jenkins environment
      ansible.builtin.copy:
        dest: /etc/systemd/system/jenkins.service.d/override.conf
        mode: "0644"
        content: |
          [Service]
          Environment="CASC_JENKINS_CONFIG={{ jenkins_casc_dir }}/jenkins.yaml"
          Environment="JAVA_OPTS=-Djenkins.install.runSetupWizard=false"

    - name: Reload systemd
      ansible.builtin.systemd_service:
        daemon_reload: true

    # ==================================================
    # PROJECT
    # ==================================================

    - name: Remove old project directory if broken
      ansible.builtin.file:
        path: "{{ project_dir }}"
        state: absent

    - name: Clone Practical Task repository
      ansible.builtin.git:
        repo: "https://github.com/paradisecreate/Practical-task-.git"
        dest: "{{ project_dir }}"
        version: "{{ practical_task_branch }}"
        force: true

    - name: Set project ownership
      ansible.builtin.file:
        path: "{{ project_dir }}"
        owner: jenkins
        group: jenkins
        recurse: true

    # ==================================================
    # START JENKINS
    # ==================================================

    - name: Enable and start Jenkins
      ansible.builtin.systemd_service:
        name: jenkins
        enabled: true
        state: started

    - name: Wait for Jenkins
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 8080
        timeout: 180

    # ==================================================
    # VERIFICATION
    # ==================================================

    - name: Verify website directory
      ansible.builtin.stat:
        path: "{{ project_dir }}/website"
      register: website_directory

    - name: Assert website directory exists
      ansible.builtin.assert:
        that:
          - website_directory.stat.exists
          - website_directory.stat.isdir
        fail_msg: "website directory was not found."

    - name: Verify index.html
      ansible.builtin.stat:
        path: "{{ project_dir }}/website/index.html"
      register: index_file

    - name: Assert index.html exists
      ansible.builtin.assert:
        that:
          - index_file.stat.exists
        fail_msg: "website/index.html was not found."

    - name: Check Docker
      ansible.builtin.command:
        cmd: docker --version
      changed_when: false

    - name: Check Java
      ansible.builtin.command:
        cmd: java -version
      changed_when: false

    - name: Check AWS CLI
      ansible.builtin.command:
        cmd: aws --version
      changed_when: false

    - name: Check Jenkins
      ansible.builtin.command:
        cmd: systemctl is-active jenkins
      changed_when: false