---
- name: Configure Practical Task EC2
  hosts: localhost
  connection: local
  become: true

  vars:
    jenkins_home: /var/lib/jenkins
    project_dir: /opt/practical-task

  tasks:

    - name: Install required packages
      ansible.builtin.dnf:
        name:
          - git
          - wget
          - curl
          - java-21-amazon-corretto
          - docker
          - awscli2
        state: present

    - name: Start Docker
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: true

    - name: Add Jenkins repository
      ansible.builtin.get_url:
        url: https://pkg.jenkins.io/rpm-stable/jenkins.repo
        dest: /etc/yum.repos.d/jenkins.repo
        mode: "0644"

    - name: Import Jenkins key
      ansible.builtin.rpm_key:
        key: https://pkg.jenkins.io/rpm-stable/jenkins.io-2026.key
        state: present

    - name: Install Jenkins
      ansible.builtin.dnf:
        name: jenkins
        state: present

    - name: Add Jenkins to Docker group
      ansible.builtin.user:
        name: jenkins
        groups: docker
        append: true

    - name: Create Jenkins override directory
      ansible.builtin.file:
        path: /etc/systemd/system/jenkins.service.d
        state: directory
        mode: "0755"

    - name: Disable Jenkins setup wizard
      ansible.builtin.copy:
        dest: /etc/systemd/system/jenkins.service.d/override.conf
        mode: "0644"
        content: |
          [Service]
          Environment="JAVA_OPTS=-Djenkins.install.runSetupWizard=false -Xmx384m"

    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Start Jenkins
      ansible.builtin.systemd:
        name: jenkins
        state: started
        enabled: true

    - name: Wait for Jenkins
      ansible.builtin.uri:
        url: http://localhost:8080/login
        status_code:
          - 200
          - 403
        timeout: 5
      register: jenkins_ready
      until: jenkins_ready.status in [200, 403]
      retries: 30
      delay: 5

    - name: Download Jenkins CLI
      ansible.builtin.get_url:
        url: http://localhost:8080/jnlpJars/jenkins-cli.jar
        dest: /tmp/jenkins-cli.jar
        mode: "0644"

    - name: Install Jenkins plugins
      ansible.builtin.shell: |
        java -jar /tmp/jenkins-cli.jar \
          -s http://localhost:8080/ \
          install-plugin \
          configuration-as-code \
          job-dsl \
          workflow-aggregator \
          git
      args:
        executable: /bin/bash

    - name: Stop Jenkins before configuration
      ansible.builtin.systemd:
        name: jenkins
        state: stopped

    - name: Create JCasC directory
      ansible.builtin.file:
        path: "{{ jenkins_home }}/casc"
        state: directory
        owner: jenkins
        group: jenkins
        mode: "0755"

    - name: Copy Jenkins configuration
      ansible.builtin.copy:
        src: "{{ project_dir }}/jenkins/jenkins.yaml"
        dest: "{{ jenkins_home }}/casc/jenkins.yaml"
        remote_src: true
        owner: jenkins
        group: jenkins
        mode: "0644"

    - name: Copy Jenkins Job DSL
      ansible.builtin.copy:
        src: "{{ project_dir }}/jenkins/jobs.groovy"
        dest: "{{ jenkins_home }}/casc/jobs.groovy"
        remote_src: true
        owner: jenkins
        group: jenkins
        mode: "0644"

    - name: Configure JCasC
      ansible.builtin.copy:
        dest: /etc/systemd/system/jenkins.service.d/override.conf
        mode: "0644"
        content: |
          [Service]
          Environment="JAVA_OPTS=-Djenkins.install.runSetupWizard=false -Xmx384m"
          Environment="CASC_JENKINS_CONFIG=/var/lib/jenkins/casc/jenkins.yaml"

    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Start configured Jenkins
      ansible.builtin.systemd:
        name: jenkins
        state: started
        enabled: true