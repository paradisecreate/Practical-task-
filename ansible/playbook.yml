---
- name: Configure Practical Task EC2
  hosts: localhost
  connection: local
  become: true

  vars:
    jenkins_home: /var/lib/jenkins
    project_dir: /opt/practical-task
    plugin_manager_version: "2.15.0"

  tasks:

    - name: Install required packages
      ansible.builtin.dnf:
        name:
          - git
          - wget
          - curl
          - fontconfig
          - java-21-amazon-corretto
          - docker
        state: present

    - name: Enable and start Docker
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started

    - name: Add Jenkins repository
      ansible.builtin.get_url:
        url: https://pkg.jenkins.io/rpm-stable/jenkins.repo
        dest: /etc/yum.repos.d/jenkins.repo
        mode: "0644"

    - name: Import Jenkins repository key
      ansible.builtin.rpm_key:
        key: https://pkg.jenkins.io/rpm-stable/jenkins.io-2026.key
        state: present

    - name: Install Jenkins
      ansible.builtin.dnf:
        name: jenkins
        state: present

    - name: Add Jenkins to Docker group
      ansible.builtin.user:
        name: jenkins
        groups: docker
        append: true

    - name: Make sure Jenkins is stopped before configuration
      ansible.builtin.systemd:
        name: jenkins
        state: stopped
      failed_when: false

    - name: Create Jenkins plugins directory
      ansible.builtin.file:
        path: "{{ jenkins_home }}/plugins"
        state: directory
        owner: jenkins
        group: jenkins
        mode: "0755"

    - name: Create Jenkins JCasC directory
      ansible.builtin.file:
        path: "{{ jenkins_home }}/casc"
        state: directory
        owner: jenkins
        group: jenkins
        mode: "0755"

    - name: Download Jenkins plugin manager
      ansible.builtin.get_url:
        url: "https://github.com/jenkinsci/plugin-installation-manager-tool/releases/download/{{ plugin_manager_version }}/jenkins-plugin-manager-{{ plugin_manager_version }}.jar"
        dest: /tmp/jenkins-plugin-manager.jar
        mode: "0644"

    - name: Install required Jenkins plugins
      ansible.builtin.command:
        argv:
          - java
          - -Xmx256m
          - -jar
          - /tmp/jenkins-plugin-manager.jar
          - --war
          - /usr/share/java/jenkins.war
          - --plugin-download-directory
          - "{{ jenkins_home }}/plugins"
          - --plugins
          - configuration-as-code
          - job-dsl
          - workflow-aggregator
          - git

    - name: Set Jenkins plugins ownership
      ansible.builtin.file:
        path: "{{ jenkins_home }}/plugins"
        owner: jenkins
        group: jenkins
        recurse: true

    - name: Copy Jenkins JCasC configuration
      ansible.builtin.copy:
        src: "{{ project_dir }}/jenkins/jenkins.yaml"
        dest: "{{ jenkins_home }}/casc/jenkins.yaml"
        remote_src: true
        owner: jenkins
        group: jenkins
        mode: "0644"

    - name: Copy Jenkins Job DSL
      ansible.builtin.copy:
        src: "{{ project_dir }}/jenkins/jobs.groovy"
        dest: "{{ jenkins_home }}/casc/jobs.groovy"
        remote_src: true
        owner: jenkins
        group: jenkins
        mode: "0644"

    - name: Create Jenkins systemd override directory
      ansible.builtin.file:
        path: /etc/systemd/system/jenkins.service.d
        state: directory
        mode: "0755"

    - name: Configure Jenkins startup
      ansible.builtin.copy:
        dest: /etc/systemd/system/jenkins.service.d/override.conf
        mode: "0644"
        content: |
          [Service]
          Environment="JAVA_OPTS=-Djenkins.install.runSetupWizard=false -Xmx384m"
          Environment="CASC_JENKINS_CONFIG=/var/lib/jenkins/casc/jenkins.yaml"

    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Enable and start Jenkins
      ansible.builtin.systemd:
        name: jenkins
        enabled: true
        state: started

    - name: Wait for Jenkins to respond
      ansible.builtin.uri:
        url: http://localhost:8080/
        status_code:
          - 200
          - 403
        timeout: 5
      register: jenkins_status
      until: jenkins_status.status in [200, 403]
      retries: 30
      delay: 5