---
- name: Configure Practical Task EC2
  hosts: localhost
  connection: local
  become: true

  vars:
    jenkins_home: /var/lib/jenkins
    project_dir: /opt/practical-task
    plugin_manager_version: "2.15.0"

  tasks:

    # --------------------------------------------------
    # Required packages
    # --------------------------------------------------

    - name: Install required packages
      ansible.builtin.dnf:
        name:
          - git
          - wget
          - fontconfig
          - java-21-amazon-corretto
          - docker
          - nodejs
        state: present

    # --------------------------------------------------
    # Docker
    # --------------------------------------------------

    - name: Enable and start Docker
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started

    # --------------------------------------------------
    # Jenkins repository
    # --------------------------------------------------

    - name: Add Jenkins repository
      ansible.builtin.get_url:
        url: https://pkg.jenkins.io/rpm-stable/jenkins.repo
        dest: /etc/yum.repos.d/jenkins.repo
        mode: "0644"

    - name: Import Jenkins repository key
      ansible.builtin.rpm_key:
        key: https://pkg.jenkins.io/rpm-stable/jenkins.io-2026.key
        state: present

    # --------------------------------------------------
    # Jenkins
    # --------------------------------------------------

    - name: Install Jenkins
      ansible.builtin.dnf:
        name: jenkins
        state: present

    - name: Add Jenkins to Docker group
      ansible.builtin.user:
        name: jenkins
        groups: docker
        append: true

    - name: Make sure Jenkins is stopped before configuration
      ansible.builtin.systemd:
        name: jenkins
        state: stopped
      failed_when: false

    # --------------------------------------------------
    # Jenkins directories
    # --------------------------------------------------

    - name: Create Jenkins plugins directory
      ansible.builtin.file:
        path: "{{ jenkins_home }}/plugins"
        state: directory
        owner: jenkins
        group: jenkins
        mode: "0755"

    - name: Create Jenkins JCasC directory
      ansible.builtin.file:
        path: "{{ jenkins_home }}/casc"
        state: directory
        owner: jenkins
        group: jenkins
        mode: "0755"

    - name: Create Jenkins temp directory
      ansible.builtin.file:
        path: "{{ jenkins_home }}/tmp"
        state: directory
        owner: jenkins
        group: jenkins
        mode: "0755"

    # --------------------------------------------------
    # Jenkins plugins
    # --------------------------------------------------

    - name: Download Jenkins plugin manager
      ansible.builtin.get_url:
        url: "https://github.com/jenkinsci/plugin-installation-manager-tool/releases/download/{{ plugin_manager_version }}/jenkins-plugin-manager-{{ plugin_manager_version }}.jar"
        dest: /tmp/jenkins-plugin-manager.jar
        mode: "0644"

    - name: Install required Jenkins plugins
      ansible.builtin.command:
        argv:
          - java
          - -Xmx384m
          - -jar
          - /tmp/jenkins-plugin-manager.jar
          - --war
          - /usr/share/java/jenkins.war
          - --plugin-download-directory
          - "{{ jenkins_home }}/plugins"
          - --plugins
          - configuration-as-code
          - job-dsl
          - workflow-aggregator
          - git
          - github

    - name: Set Jenkins plugins ownership
      ansible.builtin.file:
        path: "{{ jenkins_home }}/plugins"
        owner: jenkins
        group: jenkins
        recurse: true

    # --------------------------------------------------
    # Jenkins Configuration as Code
    # --------------------------------------------------

    - name: Copy Jenkins JCasC configuration
      ansible.builtin.copy:
        src: "{{ project_dir }}/jenkins/jenkins.yaml"
        dest: "{{ jenkins_home }}/casc/jenkins.yaml"
        remote_src: true
        owner: jenkins
        group: jenkins
        mode: "0644"

    - name: Copy Jenkins Job DSL
      ansible.builtin.copy:
        src: "{{ project_dir }}/jenkins/jobs.groovy"
        dest: "{{ jenkins_home }}/casc/jobs.groovy"
        remote_src: true
        owner: jenkins
        group: jenkins
        mode: "0644"

    # --------------------------------------------------
    # Jenkins systemd configuration
    # --------------------------------------------------

    - name: Create Jenkins systemd override directory
      ansible.builtin.file:
        path: /etc/systemd/system/jenkins.service.d
        state: directory
        mode: "0755"

    - name: Configure Jenkins
      ansible.builtin.copy:
        dest: /etc/systemd/system/jenkins.service.d/override.conf
        mode: "0644"
        content: |
          [Service]
          Environment="JAVA_OPTS=-Djava.awt.headless=true -Djenkins.install.runSetupWizard=false -Xmx256m -Djava.io.tmpdir=/var/lib/jenkins/tmp"
          Environment="CASC_JENKINS_CONFIG=/var/lib/jenkins/casc/jenkins.yaml"

    # --------------------------------------------------
    # Requirements Board backend
    # --------------------------------------------------

    - name: Give Jenkins ownership of project repository
      ansible.builtin.file:
        path: "{{ project_dir }}"
        owner: jenkins
        group: jenkins
        recurse: true

    - name: Configure Git username for board backend
      ansible.builtin.command:
        argv:
          - git
          - -C
          - "{{ project_dir }}"
          - config
          - user.name
          - "Practical Task Board"
      become_user: jenkins
      changed_when: false

    - name: Configure Git email for board backend
      ansible.builtin.command:
        argv:
          - git
          - -C
          - "{{ project_dir }}"
          - config
          - user.email
          - "practical-task-board@localhost"
      become_user: jenkins
      changed_when: false

    - name: Configure Git credential helper
      ansible.builtin.command:
        argv:
          - git
          - config
          - --global
          - credential.helper
          - store
      become_user: jenkins
      environment:
        HOME: /var/lib/jenkins
      changed_when: false

    - name: Create board secret
      ansible.builtin.shell: |
        printf 'BOARD_SECRET=%s\n' \
          "$(python3 -c 'import secrets; print(secrets.token_urlsafe(18))')" \
          > /etc/practical-task-board.env
        chmod 600 /etc/practical-task-board.env
      args:
        creates: /etc/practical-task-board.env

    - name: Create backend systemd service
      ansible.builtin.copy:
        dest: /etc/systemd/system/practical-task-backend.service
        mode: "0644"
        content: |
          [Unit]
          Description=Practical Task Requirements Board Backend
          Wants=network-online.target
          After=network-online.target

          [Service]
          Type=simple
          User=jenkins
          Group=jenkins
          WorkingDirectory=/opt/practical-task
          EnvironmentFile=/etc/practical-task-board.env
          Environment="GIT_BRANCH=terraform-automation"
          Environment="HOME=/var/lib/jenkins"
          ExecStart=/usr/bin/node /opt/practical-task/server.js
          Restart=always
          RestartSec=3

          [Install]
          WantedBy=multi-user.target

    # --------------------------------------------------
    # Start services
    # --------------------------------------------------

    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Enable and start backend
      ansible.builtin.systemd:
        name: practical-task-backend
        enabled: true
        state: started

    - name: Enable and start Jenkins
      ansible.builtin.systemd:
        name: jenkins
        enabled: true
        state: started

    # --------------------------------------------------
    # Verify backend
    # --------------------------------------------------

    - name: Wait for board backend
      ansible.builtin.uri:
        url: http://localhost:3000/health
        status_code: 200
        timeout: 5
      register: backend_status
      until: backend_status.status == 200
      retries: 20
      delay: 3

    # --------------------------------------------------
    # Verify Jenkins
    # --------------------------------------------------

    - name: Wait for Jenkins to respond
      ansible.builtin.uri:
        url: http://localhost:8080/
        status_code:
          - 200
          - 403
        timeout: 5
      register: jenkins_status
      until: jenkins_status.status in [200, 403]
      retries: 40
      delay: 5

    - name: Wait for practical task pipeline
      ansible.builtin.uri:
        url: http://localhost:8080/job/practical-task-pipeline/api/json
        status_code: 200
        timeout: 5
      register: pipeline_status
      until: pipeline_status.status == 200
      retries: 20
      delay: 3

    # --------------------------------------------------
    # Final checks
    # --------------------------------------------------

    - name: Verify Docker is active
      ansible.builtin.command:
        cmd: systemctl is-active docker
      changed_when: false

    - name: Verify Jenkins is active
      ansible.builtin.command:
        cmd: systemctl is-active jenkins
      changed_when: false

    - name: Verify backend is active
      ansible.builtin.command:
        cmd: systemctl is-active practical-task-backend
      changed_when: false

    - name: Verify Node.js
      ansible.builtin.command:
        cmd: node --version
      changed_when: false

    - name: Verify AWS CLI
      ansible.builtin.command:
        cmd: aws --version
      changed_when: false