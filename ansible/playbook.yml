---
- name: Configure Practical Task EC2
  hosts: localhost
  become: true

  vars:
    practical_task_repo: "https://github.com/paradisecreate/Practical-task-.git"
    project_dir: /opt/practical-task

  tasks:
    - name: Update Amazon Linux packages
      ansible.builtin.yum:
        name: "*"
        state: latest
        update_cache: true

    - name: Install required packages
      ansible.builtin.yum:
        name:
          - git
          - curl
          - unzip
        state: present

    - name: Create project directory
      ansible.builtin.file:
        path: /opt/practical-task
        state: directory
        mode: "0755"

    - name: Clone Practical Task repository
      ansible.builtin.git:
        repo: "{{ practical_task_repo }}"
        dest: /opt/practical-task
        version: main
        force: true

    - name: Install CloudWatch Agent
      ansible.builtin.dnf:
        name: amazon-cloudwatch-agent
        state: present

    - name: Ensure CloudWatch Agent config directory exists
      ansible.builtin.file:
        path: /opt/aws/amazon-cloudwatch-agent/etc
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Copy CloudWatch Agent configuration
      ansible.builtin.copy:
        src: "{{ project_dir }}/cloudwatch/amazon-cloudwatch-agent.json"
        dest: /opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json
        remote_src: true
        owner: root
        group: root
        mode: "0644"

    - name: Apply CloudWatch Agent configuration
      ansible.builtin.command:
        cmd: >
          /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl
          -a fetch-config
          -m ec2
          -c file:/opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json
          -s
      changed_when: true

    - name: Enable CloudWatch Agent
      ansible.builtin.systemd:
        name: amazon-cloudwatch-agent
        enabled: true
        state: started

    - name: Check website directory
      ansible.builtin.stat:
        path: /opt/practical-task/website
      register: website_directory

    - name: Verify website directory exists
      ansible.builtin.assert:
        that:
          - website_directory.stat.exists
          - website_directory.stat.isdir
        fail_msg: "The website directory was not found."
        success_msg: "Website directory found successfully."

    - name: Check index.html
      ansible.builtin.stat:
        path: /opt/practical-task/website/index.html
      register: index_file

    - name: Verify index.html exists
      ansible.builtin.assert:
        that:
          - index_file.stat.exists
        fail_msg: "website/index.html was not found."
        success_msg: "website/index.html found successfully."