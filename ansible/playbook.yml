---
- name: Configure Practical Task EC2
  hosts: localhost
  connection: local
  become: true

  vars:
    practical_task_repo: "https://github.com/paradisecreate/Practical-task-.git"
    project_dir: "/opt/practical-task"
    jenkins_casc_dir: "/var/lib/jenkins/casc"

  tasks:
    # --------------------------------------------------
    # System packages
    # --------------------------------------------------

    - name: Update Amazon Linux packages
      ansible.builtin.dnf:
        name: "*"
        state: latest
        update_cache: true

    - name: Install required packages
      ansible.builtin.dnf:
        name:
          - git
          - unzip
          - wget
          - fontconfig
          - java-21-amazon-corretto
          - docker
        state: present

    # --------------------------------------------------
    # Docker
    # --------------------------------------------------

    - name: Enable and start Docker
      ansible.builtin.systemd_service:
        name: docker
        enabled: true
        state: started

    # --------------------------------------------------
    # Jenkins repository
    # --------------------------------------------------

    - name: Add Jenkins repository
      ansible.builtin.get_url:
        url: https://pkg.jenkins.io/rpm-stable/jenkins.repo
        dest: /etc/yum.repos.d/jenkins.repo
        mode: "0644"

    - name: Import Jenkins repository key
      ansible.builtin.rpm_key:
        state: present
        key: https://pkg.jenkins.io/redhat-stable/jenkins.io-2026.key

    # --------------------------------------------------
    # Jenkins
    # --------------------------------------------------

    - name: Install Jenkins
      ansible.builtin.dnf:
        name: jenkins
        state: present

    - name: Add Jenkins user to Docker group
      ansible.builtin.user:
        name: jenkins
        groups: docker
        append: true

    # --------------------------------------------------
    # Jenkins plugins
    # --------------------------------------------------

    - name: Create Jenkins plugins directory
      ansible.builtin.file:
        path: /var/lib/jenkins/plugins
        state: directory
        owner: jenkins
        group: jenkins
        mode: "0755"

    - name: Download Jenkins plugin manager
      ansible.builtin.get_url:
        url: https://github.com/jenkinsci/plugin-installation-manager-tool/releases/latest/download/jenkins-plugin-manager.jar
        dest: /opt/jenkins-plugin-manager.jar
        mode: "0644"

    - name: Install required Jenkins plugins
      ansible.builtin.command:
        cmd: >
          java -jar /opt/jenkins-plugin-manager.jar
          --war /usr/share/java/jenkins.war
          --plugin-download-directory /var/lib/jenkins/plugins
          --plugins configuration-as-code job-dsl workflow-aggregator git
      changed_when: true

    - name: Set Jenkins plugin ownership
      ansible.builtin.file:
        path: /var/lib/jenkins/plugins
        owner: jenkins
        group: jenkins
        recurse: true

    # --------------------------------------------------
    # Jenkins Configuration as Code
    # --------------------------------------------------

    - name: Create Jenkins JCasC directory
      ansible.builtin.file:
        path: "{{ jenkins_casc_dir }}"
        state: directory
        owner: jenkins
        group: jenkins
        mode: "0755"

    - name: Copy Jenkins JCasC configuration
      ansible.builtin.copy:
        src: /opt/bootstrap-repo/jenkins/jenkins.yaml
        dest: "{{ jenkins_casc_dir }}/jenkins.yaml"
        remote_src: true
        owner: jenkins
        group: jenkins
        mode: "0644"

    - name: Copy Jenkins Job DSL
      ansible.builtin.copy:
        src: /opt/bootstrap-repo/jenkins/jobs.groovy
        dest: "{{ jenkins_casc_dir }}/jobs.groovy"
        remote_src: true
        owner: jenkins
        group: jenkins
        mode: "0644"

    # --------------------------------------------------
    # Disable Jenkins setup wizard + enable JCasC
    # --------------------------------------------------

    - name: Create Jenkins systemd override directory
      ansible.builtin.file:
        path: /etc/systemd/system/jenkins.service.d
        state: directory
        mode: "0755"

    - name: Configure Jenkins environment
      ansible.builtin.copy:
        dest: /etc/systemd/system/jenkins.service.d/override.conf
        mode: "0644"
        content: |
          [Service]
          Environment="CASC_JENKINS_CONFIG={{ jenkins_casc_dir }}/jenkins.yaml"
          Environment="JAVA_OPTS=-Djenkins.install.runSetupWizard=false"

    - name: Reload systemd
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: Enable and restart Jenkins
      ansible.builtin.systemd_service:
        name: jenkins
        enabled: true
        state: restarted

    # --------------------------------------------------
    # Wait for Jenkins
    # --------------------------------------------------

    - name: Wait for Jenkins port 8080
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 8080
        timeout: 180

    # --------------------------------------------------
    # Project
    # --------------------------------------------------

    - name: Create project directory
      ansible.builtin.file:
        path: "{{ project_dir }}"
        state: directory
        owner: jenkins
        group: jenkins
        mode: "0755"

    - name: Clone Practical Task repository
      ansible.builtin.git:
        repo: "{{ practical_task_repo }}"
        dest: "{{ project_dir }}"
        version: terraform-automation
        force: true

    - name: Set project ownership
      ansible.builtin.file:
        path: "{{ project_dir }}"
        owner: jenkins
        group: jenkins
        recurse: true

    # --------------------------------------------------
    # Verification
    # --------------------------------------------------

    - name: Check website directory
      ansible.builtin.stat:
        path: "{{ project_dir }}/website"
      register: website_directory

    - name: Verify website directory exists
      ansible.builtin.assert:
        that:
          - website_directory.stat.exists
          - website_directory.stat.isdir
        fail_msg: "The website directory was not found."
        success_msg: "Website directory found successfully."

    - name: Check index.html
      ansible.builtin.stat:
        path: "{{ project_dir }}/website/index.html"
      register: index_file

    - name: Verify index.html exists
      ansible.builtin.assert:
        that:
          - index_file.stat.exists
        fail_msg: "website/index.html was not found."
        success_msg: "website/index.html found successfully."

    - name: Check Docker version
      ansible.builtin.command:
        cmd: docker --version
      changed_when: false

    - name: Check Java version
      ansible.builtin.command:
        cmd: java -version
      changed_when: false

    - name: Check AWS CLI
      ansible.builtin.command:
        cmd: aws --version
      changed_when: false

    - name: Check Jenkins service
      ansible.builtin.command:
        cmd: systemctl is-active jenkins
      changed_when: false