# Generated by GitHub Copilot
# nginx serves the website on port 80 AND forwards /api/ to the Node
# backend (server.js) on the host's port 3000. This lets the board reach
# the API over port 80 only — no extra public port needed.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index indexKZ.html;

    # Static website files.
    location / {
        try_files $uri $uri/ =404;
    }

    # Board API: forward to the backend running on the host.
    # host.docker.internal resolves to the EC2 host (see --add-host in
    # the Jenkins deploy step). Same-origin, so no CORS needed.
    location /api/ {
        proxy_pass http://host.docker.internal:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
