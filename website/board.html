<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Requirements Board</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background-color: #f4f7fb; color: #222; }

        nav { background-color: #1f2937; padding: 20px 50px; display: flex; justify-content: space-between; align-items: center; }
        nav h2 { color: white; }
        nav ul { list-style: none; display: flex; gap: 25px; }
        nav a { color: white; text-decoration: none; }
        nav a:hover { color: #60a5fa; }

        .wrap { max-width: 700px; margin: 40px auto; padding: 0 20px; }
        h1 { margin-bottom: 10px; }
        .intro { color: #555; margin-bottom: 25px; line-height: 1.5; }

        label { display: block; font-weight: bold; margin-bottom: 8px; }
        textarea {
            width: 100%; min-height: 100px; padding: 12px; font-size: 16px;
            border: 1px solid #cbd5e1; border-radius: 8px; font-family: inherit; resize: vertical;
        }
        textarea:focus { outline: 2px solid #2563eb; border-color: #2563eb; }

        button {
            margin-top: 15px; background-color: #2563eb; color: white; border: none;
            padding: 12px 25px; font-size: 16px; border-radius: 6px; cursor: pointer;
        }
        button:hover:not(:disabled) { background-color: #1d4ed8; }
        button:disabled { background-color: #94a3b8; cursor: not-allowed; }

        #status { margin-top: 20px; padding: 12px 15px; border-radius: 8px; display: none; }
        #status.ok { display: block; background: #dcfce7; color: #166534; }
        #status.err { display: block; background: #fee2e2; color: #991b1b; }
    </style>
</head>
<body>
    <nav>
        <h2>My Website</h2>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="board.html">Board</a></li>
        </ul>
    </nav>

    <main class="wrap">
        <h1>Requirements Board</h1>
        <p class="intro">
            Type a requirement below. When you submit, it gets added to the website
            and pushed to GitHub. Jenkins then deploys the change automatically.
        </p>

        <form id="form">
            <label for="req">New requirement</label>
            <textarea id="req" name="req" maxlength="500"
                placeholder="e.g. Add a contact section with an email address" required></textarea>
            <button type="submit" id="submitBtn">Submit &amp; Deploy</button>
        </form>

        <p id="status" role="status" aria-live="polite"></p>
    </main>

    <script>
        // Generated by GitHub Copilot
        // Sends the typed requirement to the local backend (server.js),
        // which edits the site and pushes to GitHub.
        const BACKEND = 'http://localhost:3000/api/requirement';

        const form = document.getElementById('form');
        const req = document.getElementById('req');
        const btn = document.getElementById('submitBtn');
        const status = document.getElementById('status');

        function showStatus(msg, ok) {
            status.textContent = msg;
            status.className = ok ? 'ok' : 'err';
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = req.value.trim();
            if (!text) { return; }

            btn.disabled = true;
            showStatus('Submitting...', true);

            try {
                const res = await fetch(BACKEND, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ requirement: text })
                });
                const data = await res.json();
                if (data.ok) {
                    showStatus(data.message || 'Done!', true);
                    req.value = '';
                } else {
                    showStatus('Error: ' + (data.error || 'unknown'), false);
                }
            } catch (err) {
                showStatus('Could not reach the backend. Is server.js running?', false);
            } finally {
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
